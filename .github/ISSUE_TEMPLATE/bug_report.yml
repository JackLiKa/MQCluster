name: Bug report
description: Report a problem or unexpected behavior.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps to reproduce the behavior.
      placeholder: |
        1. Start the backend with `./mvnw spring-boot:run`
        2. Start the frontend with `npm run dev` and open `http://localhost:3000/`
        3. Open e.g. `/mq/kafka?tab=stress` and click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include logs or screenshots if applicable.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java and Node versions, browser, the MQ and tab involved, and the commit hash.
      placeholder: |
        - OS: macOS 15
        - Java: 21.0.11
        - Node: 22.x
        - Browser: Chrome 140
        - MQ / tab: kafka / 内部机制
        - Commit: abc1234
    validations:
      required: false
