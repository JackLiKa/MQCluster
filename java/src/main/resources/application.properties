spring.application.name=MQCluster
server.port=8088

cluster.cors.allowed-origins=http://localhost:3000

cluster.pseudo.cluster-id=local-lab
cluster.pseudo.tap-device-name=ClusterTap0
cluster.pseudo.cidr=10.77.0.0/24
cluster.pseudo.work-dir=run/pseudo-cluster
cluster.pseudo.auto-start=false
cluster.pseudo.clean-store-on-start=true
cluster.pseudo.health-timeout=5s
cluster.pseudo.tap.enabled=false
cluster.pseudo.tap.timeout=10s

cluster.rocketmq.cluster-id=rocketmq-demo
cluster.rocketmq.dashboard-name=${CLUSTER_ROCKETMQ_DASHBOARD_NAME:}
cluster.rocketmq.name-servers=${CLUSTER_ROCKETMQ_NAME_SERVERS:}

cluster.stream.publish-interval-ms=5000

cluster.kafka.enabled=true
cluster.kafka.cluster-id=kafka-lab
cluster.kafka.work-dir=run/kafka-cluster
cluster.kafka.clean-store-on-start=true

cluster.rabbitmq.enabled=true
cluster.rabbitmq.cluster-id=rabbitmq-lab
cluster.rabbitmq.work-dir=run/rabbitmq-cluster

# 嵌入式 Kafka / Qpid 日志降噪
logging.level.org.apache.kafka=WARN
logging.level.kafka=WARN
logging.level.state.change.logger=WARN
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.com.yammer.metrics.reporting.JmxReporter=ERROR
logging.level.org.apache.qpid=WARN
logging.level.qpid.message=WARN
